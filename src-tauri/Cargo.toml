[package]
name = "mifask-android-cleaner"
version = "1.0.0"
description = "Safety-first Android device inspection desktop application"
authors = ["MIFASK"]
edition = "2021"

[lib]
name = "mifask_android_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mifask-android-cleaner"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
