name: Web edition CI
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/agent/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/agent/**'
      - '.github/workflows/web-ci.yml'
jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Check local agent syntax
        working-directory: .
        run: node --check apps/agent/server.mjs
